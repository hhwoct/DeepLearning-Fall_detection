# 摔倒检测系统 - Conda 环境定义
# 用法: conda env create -f environment.yml
name: fall_detection
channels:
  - defaults
dependencies:
  - python=3.8
  - pip
  - pip:
      - torch==2.4.1
      - torchvision==0.19.1
      - opencv-python==4.13.0.92
      - numpy==1.24.4
      - scipy==1.10.1
      - pillow==10.4.0
      - matplotlib==3.7.5
      - tqdm==4.65.2
      - scikit-learn==1.3.2
      - seaborn==0.13.2
      - mediapipe==0.10.8
